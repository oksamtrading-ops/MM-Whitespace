name: test

# Every push on every branch, deliberately. The guard job below is the only
# thing standing between a routine commit and a licensed workbook in GitHub
# history, and restricting it to main would leave feature branches unchecked --
# which is where the work actually happens.
on:
  push:
  pull_request:
  workflow_dispatch:

# Deliberately NOT run here: scripts/parity_check.mjs and
# scripts/verify_ground_truth.py. Both read the source workbooks, which carry
# personal data and two third-party licences and are never committed. They run
# locally or in a nightly job with access to the private copies.

jobs:
  guard:
    name: no licensed workbook is tracked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Assert only the synthetic fixture is tracked
        run: |
          tracked=$(git ls-files '*.xlsx' '*.xlsb' '*.xlsm' | grep -v '^tests/fixtures/synthetic_whitespace.xlsx$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::A licensed workbook is tracked. These files must never be committed:"
            echo "$tracked"
            exit 1
          fi
          echo "OK - only the synthetic fixture is tracked."
      - name: Assert no workbook is anywhere in history
        run: |
          hist=$(git log --all --diff-filter=A --name-only --pretty=format: \
                 | sort -u \
                 | grep -iE '\.(xlsx|xlsb|xlsm)$' \
                 | grep -v '^tests/fixtures/synthetic_whitespace.xlsx$' || true)
          if [ -n "$hist" ]; then
            echo "::error::A licensed workbook exists in git history and must be removed:"
            echo "$hist"
            exit 1
          fi
          echo "OK - no licensed workbook has ever been committed."

  node:
    name: libraries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      # Node 24 runs TypeScript directly and node:sqlite is built in, but the
      # suite is not dependency-free: since the Sql seam (10 September 2026)
      # tests reach the database through open.ts, which imports pg and
      # @vercel/functions. Without this install the job failed on every
      # commit for a month.
      - run: npm ci
      - run: npm run test:node

  auth:
    name: every endpoint asserts a role
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      # Middleware is not an authorisation boundary and a Server Action is
      # addressable whether or not its control renders, so this is a build
      # gate rather than a convention.
      - run: npm run check:auth
      # The brand green fails contrast on white at 2.27:1 and the failure is
      # invisible to eye-checking, so tokens are verified arithmetically.
      - run: npm run check:contrast

  app:
    name: the application builds and type-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build

  journeys:
    name: five journeys and six routes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install openpyxl
      - run: npm ci
      # Drives a real server over HTTP against a database built by the real
      # pipeline. Not unit tests with the network stubbed out.
      - run: npm run e2e

  python:
    # Named explicitly so the check names stay "parser (3.9)" and
    # "parser (3.12)" rather than gaining the runner image.
    name: parser (${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor this code targets; the upper version catches drift.
        #
        # 3.9 is pinned to Ubuntu 24.04 because setup-python has no 3.9 build
        # for 26.04, which ubuntu-latest becomes from 19 October 2026 -- 3.9
        # ended upstream at 3.9.25, before that image existed. When GitHub
        # retires ubuntu-24.04 this floor can no longer be tested on a hosted
        # runner, and has to be raised or tested another way.
        include:
          - python-version: '3.9'
            os: ubuntu-24.04
          - python-version: '3.12'
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install openpyxl
      - run: npm run test:py

  fixture:
    name: the fixture rebuilds from source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install openpyxl
      # The committed fixture must be reproducible: delete it, regenerate it,
      # and the suite must still pass against the rebuilt file.
      - run: |
          rm -f tests/fixtures/synthetic_whitespace.xlsx
          python3 tests/fixtures/build_fixture.py
          python3 -m unittest discover -s tests
